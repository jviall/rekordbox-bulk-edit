site_name: rekordbox-edit
site_description: Tools for managing and modifying a RekordBox library en-masse
site_url: https://rekordbox-edit.readthedocs.io/
repo_url: https://github.com/jviall/rekordbox-edit
repo_name: jviall/rekordbox-edit

exclude_docs: |
  superpowers/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy

plugins:
  - search
  - open-in-new-tab
  - mkdocstrings:
      handlers:
        python:
          options:
            filters: ["!^_", "!^model_config$"]
            show_root_heading: true
            show_source: false
            members_order: source
            show_if_no_docstring: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            docstring_section_style: table

markdown_extensions:
  - admonition
  - attr_list
  - github-callouts
  - mkdocs-click
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Getting Started: index.md
  - Filtering: filtering.md
  - Commands:
      - search: commands/search.md
      - edit: commands/edit.md
      - convert: commands/convert.md
  - API Reference: api.md
