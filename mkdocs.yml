site_name: rekordbox-edit
site_description: Tools for managing and modifying a RekordBox library en-masse
site_url: https://rekordbox-edit.readthedocs.io/
repo_url: https://github.com/jviall/rekordbox-edit
repo_name: jviall/rekordbox-edit

exclude_docs: |
  superpowers/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            filters: ["!^_"]
            show_root_heading: true
            show_source: false
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - github-callouts
  - mkdocs-click
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences

nav:
  - Getting Started: index.md
  - Filtering: filtering.md
