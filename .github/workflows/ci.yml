name: CI Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  code-change:
    name: Skip Checks?
    runs-on: ubuntu-slim
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      paths_result: ${{ steps.skip_check.outputs.paths_result }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@04a1aebece824b56e6ad6a401d015479cd1c50b3 # master
        with:
          cancel_others: true
          concurrent_skipping: same_content_newer
          paths_filter: |
            code:
              paths:
                - 'rekordbox_edit/**'
                - 'tests/**'
                - 'pyproject.toml'
                - 'uv.lock'
                - 'Makefile'
                - 'ruff.toml'
              paths_ignore:
                - '**/*.md'

  lint:
    name: 🧺 Lint
    runs-on: ubuntu-latest
    needs: code-change
    if: ${{ needs.code-change.outputs.should_skip != 'true' && !fromJSON(needs.code-change.outputs.paths_result || '{}').code.should_skip }}
    env:
      PYTHON: "3.14"
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run lint tests
        uses: ./.github/actions/lint

  unit-tests:
    name: 🧪 Tests
    needs: code-change
    if: ${{ needs.code-change.outputs.should_skip != 'true' && !fromJSON(needs.code-change.outputs.paths_result || '{}').code.should_skip }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.11", "3.14"] # oldest and latest
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run unit tests
        uses: ./.github/actions/test
  all-green:
    name: ✅ All Green
    if: always()
    needs:
      - lint
      - unit-tests
    runs-on: Ubuntu-latest

    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: unit-tests, lint
          jobs: ${{ toJSON(needs) }}
