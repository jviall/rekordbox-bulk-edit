name: Version Bump and Create a Release

on:
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  version-bump:
    name: 📦 Stable Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: "${{ secrets.WORKFLOW_TOKEN }}"
          fetch-depth: 0

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_push_gpgsign: false

      - name: Create bump and changelog
        uses: ./.github/actions/commitizen-bump
        with:
          github_token: ${{ secrets.WORKFLOW_TOKEN }}
          gpg_sign: true

      - name: Build release notes
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@348e88fab4c37338b1e803ceb2d4a7a5db6c0833 # v6.2.2
        with:
          outputFile: release-notes.md
          configurationJson: |
            {
              "categories": [
                {
                  "title": "## Breaking Changes",
                  "labels": [],
                  "rules": [
                    {
                      "pattern": "^(\\w+)?(\\(.*\\))?!:",
                      "on_property": "title"
                    }
                  ]
                },
                {
                  "title": "## Features",
                  "labels": [],
                  "rules": [
                    {
                      "pattern": "^feat(\\(.*\\))?:",
                      "on_property": "title"
                    }
                  ]
                },
                {
                  "title": "## Fixes",
                  "labels": [],
                  "rules": [
                    {
                      "pattern": "^fix(?!\\(deps\\))(\\(.*\\))?:",
                      "on_property": "title"
                    }
                  ]
                },
                {
                  "title": "## Chores",
                  "labels": [],
                  "rules": [
                    {
                      "pattern": "^(chore(?!\\(deps\\))|refactor|ci|docs|style|perf|test|build)(\\(.*\\))?:",
                      "on_property": "title"
                    }
                  ]
                },
                {
                  "title": "## Dependency Updates",
                  "labels": [],
                  "rules": [
                    {
                      "pattern": "^(chore|fix)\\(deps\\):",
                      "on_property": "title"
                    }
                  ]
                }
              ],
              "exhaustive": true,
              "sort": {
                "order": "ASC",
                "on_property": "title"
              },
              "template": "#{{CHANGELOG}}\n\n## Uncategorized\n#{{UNCATEGORIZED}}",
              "pr_template": "- #{{TITLE}} (##{{NUMBER}} by @#{{AUTHOR}})",
              "empty_template": "- No changes",
              "tag_resolver": {
                "method": "sort"
              }
            }
          fromTag: "v${{ env.PREVIOUS_REVISION }}"
          toTag: "v${{ env.REVISION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}
          body_path: release-notes.md
          tag_name: "v${{ env.REVISION }}"
