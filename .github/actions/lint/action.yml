name: "Lint"
description: "Run all lint (pre-commit) checks"

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0

    - name: Setup UV
      uses: ./.github/actions/install

    - name: Run lint
      shell: bash
      run: |
        uv run ruff check --fix

    - name: Run type checks
      shell: bash
      run: |
        uv run ty check
