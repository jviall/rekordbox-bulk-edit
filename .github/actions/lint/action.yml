name: "Lint"
description: "Run all lint (pre-commit) checks"

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup UV
      uses: ./.github/actions/install

    - name: Run lint
      shell: bash
      run: |
        uv run ruff check --fix

    - name: Run type checks
      shell: bash
      run: |
        uv run ty check
