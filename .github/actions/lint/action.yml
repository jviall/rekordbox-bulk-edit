name: "Lint"
description: "Run all lint (pre-commit) checks"

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0

    - name: Setup UV
      uses: ./.github/actions/install

    - name: Run lint
      shell: bash
      run: |
        uv run ruff check --fix

    - name: Run type checks
      shell: bash
      run: |
        uv run ty check
