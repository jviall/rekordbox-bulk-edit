name: "Build Release Notes"
description: "Generate categorized, per-commit release notes with each commit's PR resolved and its author credited"
inputs:
  from_tag:
    description: "Tag to start the changelog range from (exclusive). Leave empty for full history."
    required: false
    default: ""
  to_tag:
    description: "Tag to end the changelog range at (inclusive)"
    required: true
  github_token:
    description: "GitHub token for API access"
    required: true
runs:
  using: "composite"
  steps:
    - name: Generate release notes
      shell: bash
      run: python3 "${GITHUB_ACTION_PATH}/build_release_notes.py"
      env:
        FROM_TAG: ${{ inputs.from_tag }}
        TO_TAG: ${{ inputs.to_tag }}
        OUTPUT_FILE: release-notes.md
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.github_token }}
