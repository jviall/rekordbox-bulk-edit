name: "Setup UV"
description: "Install UV, set up Python, and install dependencies"

runs:
  using: "composite"
  steps:
    - name: Install UV
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        python-version: ${{ env.PYTHON }}

    - name: Install dependencies
      shell: bash
      run: |
        uv sync --all-groups
