name: "Setup UV"
description: "Install UV, set up Python, and install dependencies"

runs:
  using: "composite"
  steps:
    - name: Install UV
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: true
        python-version: ${{ env.PYTHON }}

    - name: Install dependencies
      shell: bash
      run: |
        uv sync --all-groups
